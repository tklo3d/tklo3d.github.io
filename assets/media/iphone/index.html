<script async src="https://ga.jspm.io/npm:es-module-shims@1.7.1/dist/es-module-shims.js"></script>
<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@^0.163.0/build/three.module.min.js"
    }
  }
</script>
<script type="module" src="assets/model-viewer-module.min.js"></script>
  
<script type="module" src="assets/model-viewer-effects.min.js"></script>

<model-viewer alt="T2 Model Viewer" src="assets/green.glb" ar environment-image="assets/environment.hdr" shadow-intensity="1" exposure="1.5" camera-controls touch-action="pan-y" camera-orbit="25deg 75deg 6.752m" field-of-view="30deg">
  <effect-composer render-mode="quality" msaa="8">
    <color-grade-effect blend-mode="DEFAULT" opacity="1" saturation="0.1" tonemapping="reinhard2_adaptive"></color-grade-effect>
  </effect-composer>
  <div class="title">
    <a class="name">iPhone 16</a>
  </div>
  <div class="slider">
    <div class="slides">
      <button class="slide selected" onclick="switchSrc(this, 'green')" style="background-image: url('assets/green.jpg');"></button>
      <button class="slide" onclick="switchSrc(this, 'white')" style="background-image: url('assets/white.jpg');"></button>
      <button class="slide" onclick="switchSrc(this, 'black')" style="background-image: url('assets/black.jpg');"></button>
      <button class="slide" onclick="switchSrc(this, 'blue')" style="background-image: url('assets/blue.jpg');"></button>
      <button class="slide" onclick="switchSrc(this, 'pink')" style="background-image: url('assets/pink.jpg');"></button>
    </div>
  </div>
</model-viewer>

<script type="module">
  const modelViewer = document.querySelector("model-viewer");

  window.switchSrc = (element, name) => {
    const base = "assets/" + name;
    modelViewer.src = base + '.glb';
    modelViewer.poster = base + '.jpg';
    const slides = document.querySelectorAll(".slide");
    slides.forEach((element) => {element.classList.remove("selected");});
    element.classList.add("selected");
  };

  document.querySelector(".slider").addEventListener('beforexrselect', (ev) => {
    // Keep slider interactions from affecting the XR scene.
    ev.preventDefault();
  });
</script>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap');
    
    model-viewer {
      width: 100%;
      height: 100%;
      background-color: #161616;
      background-size: cover;
      background-position: center;
      --progress-bar-color: #cf9c2c;
    }
    
    .title {
      position: absolute;
      text-align: left;
      top: 16px;
      margin-left: 10px;
    }

    .name {
      position: absolute;
      color:#cf9c2c;
      padding: 4px 8px;
      font-size: 18px;
      font-weight: 500;
      height: 24px;
      width: 500px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      -webkit-font-smoothing: antialiased;
    }

    .slider {
    width: 100%;
    text-align: center;
    overflow: hidden;
    position: absolute;
    bottom: 16px;
    margin-left: 10px;
  }

  .slides {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }

  .slide {
    scroll-snap-align: start;
    flex-shrink: 0;
    width: 50px;
    height: 50px;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    background-color: #000000;
    margin-right: 10px;
    border-radius: 10px;
    border: none;
    display: flex;
  }

  .slide.selected {
    border: 3px solid #cf9c2c;
  }

  .slide:focus {
    outline: none;
  }

  .slide:focus-visible {
    outline: 1px solid #cf9c2c;
  }
</style>
